<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тактильный маршрут</title>
    <link rel="manifest" href="manifest.json">
    <!-- Подключаем карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        /* Стили для красивого окошка с фото и текстом */
        .point-info { max-width: 300px; }
        .point-images { 
            display: flex; 
            gap: 5px; 
            margin-bottom: 10px; 
        }
        .point-images img { 
            width: 50%; 
            height: 100px; 
            object-fit: cover; 
            border-radius: 5px; 
        }
        .point-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .point-info p { margin: 0; font-size: 14px; color: #333; line-height: 1.4; }
        .type { font-size: 12px; color: #666; margin-bottom: 5px; display: block; font-weight: bold;}
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Инициализирую карту (центр по моим координатам)
    var map = L.map('map').setView([56.471000, 84.962000], 17);

    // Добавляю слой карты (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // МОИ ТОЧКИ С ОПИСАНИЯМИ И ДВУМЯ КАРТИНКАМИ
    var points = [
        { 
            lat: 56.471184, lng: 84.961975, 
            title: "Скамейка у каскадного фонтана", 
            type: "Звуковой", 
            img1: "1_bench.jpg", img2: "1_water.jpg", 
            desc: "Сядьте на скамейку. Закройте глаза на 30 секунд. Постарайтесь отделить журчание воды в фонтане от шума дороги за спиной. Сосредоточьтесь только на звуке падающих струй." 
        },
        { 
            lat: 56.471129, lng: 84.962224, 
            title: "Гранитный куб с барельефом", 
            type: "Тактильный", 
            img1: "2_stone.jpg", img2: "2_relief.jpg", 
            desc: "Подойдите к кубу. Закройте глаза и медленно проведите ладонью по барельефу. Найдите пальцами самые выступающие части и самые глубокие впадины. Какая поверхность на ощупь – холодная или тёплая, гладкая или шершавая?" 
        },
        { 
            lat: 56.471014, lng: 84.962075, 
            title: "Каменная тропинка", 
            type: "Тактильный", 
            img1: "3_path.jpg", img2: "3_stones.jpg", 
            desc: "Пройдите по тропинке очень медленно. Почувствуйте стопами каждый камень. Камни гладкие или острые? Как они расположены – хаотично или ровно? Сравните эти ощущения с обычным асфальтом." 
        },
        { 
            lat: 56.470886, lng: 84.962347, 
            title: "Декоративные кубы", 
            type: "Тактильный", 
            img1: "4_cubes.jpg", img2: "4_grid.jpg", 
            desc: "Подойдите к кубам. Не касаясь металла, поднесите ладони близко к решетке чувствуете ли вы холод от камней внутри? Теперь аккуратно прикоснитесь к металлической сетке, а затем к камням. Сравните их текстуры." 
        },
        { 
            lat: 56.470895, lng: 84.962612, 
            title: "Фонтан", 
            type: "Комбинированный", 
            img1: "5_fountain.jpg", img2: "5_water.jpg", 
            desc: "Медленно проведите рукой над водой, не касаясь её. Чувствуете влажность или прохладу воздуха? Теперь аккуратно коснитесь воды. Сделайте глубокий вдох и послушайте, как шум фонтана заглушает все остальные звуки. Побудьте в этом моменте 20 секунд." 
        },
        { 
            lat: 56.470602, lng: 84.962543, 
            title: "Деревья", 
            type: "Комбинированный", 
            img1: "6_trees.jpg", img2: "6_moss.jpg", 
            desc: "Прислушайтесь к своим шагам: трава, листья под ногами создают собственный звук. Подойдите к стволу и приложите ладонь к мху. Какой он – мягкий, влажный? Теперь аккуратно погладьте еловую ветку, не уколовшись. Сравните ощущения: какая текстура вам приятнее? Сделайте глубокий вдох и выдох вместе с шумом ветра." 
        },
        { 
            lat: 56.470402, lng: 84.962039, 
            title: "Большие камни", 
            type: "Тактильный", 
            img1: "7_big_stone.jpg", img2: "7_texture.jpg", 
            desc: "Подойдите к самому большому камню. Положите на него обе ладони. Почувствуйте его температуру (он нагрет солнцем или прохладен?). Медленно проведите пальцами по поверхности, находя самые гладкие и самые шершавые участки." 
        }
    ];

    // Функция для добавления точек на карту
    points.forEach(function(point, index) {
        // Создаю всплывающее окно с двумя картинками и текстом
        var popupContent = `
            <div class="point-info">
                <div class="point-images">
                    <img src="${point.img1}" alt="Фото 1">
                    <img src="${point.img2}" alt="Фото 2">
                </div>
                <span class="type">Тип: ${point.type}</span>
                <h3>${index + 1}. ${point.title}</h3>
                <p>${point.desc}</p>
            </div>
        `;
        
        // Добавляю маркер
        L.marker([point.lat, point.lng])
            .addTo(map)
            .bindPopup(popupContent);
    });
</script>

</body>
</html>
